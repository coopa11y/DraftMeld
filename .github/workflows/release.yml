name: Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches: [dev, main]
    paths:
      - ".github/workflows/release.yml"
      - "CHANGELOG.md"
      - "VERSION"
      - "scripts/check-release.mjs"
      - "scripts/package-release.sh"
      - "scripts/release-notes.mjs"
      - "scripts/smoke-release.sh"
      - "scripts/zip-directory.go"
      - "deployments/docker/Dockerfile"
      - "backend/internal/document/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: coopa11y/draftmeld

jobs:
  artifacts:
    name: Native release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Validate release metadata
        id: version
        shell: bash
        run: |
          version="$(cat VERSION)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node scripts/check-release.mjs "$GITHUB_REF_NAME"
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "Release tags must point to a commit already present on main." >&2
              exit 1
            }
          else
            node scripts/check-release.mjs
          fi
      - run: npm --prefix frontend ci
      - run: npm run verify
      - name: Package native applications
        run: ./scripts/package-release.sh
      - name: Smoke-test the Linux archive
        run: ./scripts/smoke-release.sh
      - name: Attest native release artifacts
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-checksums: outputs/release/draftmeld_${{ steps.version.outputs.value }}_checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: draftmeld-native-${{ github.sha }}
          path: outputs/release/*
          if-no-files-found: error
          retention-days: 14

  container:
    name: Container release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: docker/setup-buildx-action@v4
      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/docker/Dockerfile
          load: true
          push: false
          tags: draftmeld:release-smoke
      - name: Smoke-test the container
        shell: bash
        run: |
          container_id="$(docker run --detach --publish 18080:8080 draftmeld:release-smoke)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          healthy=false
          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent http://127.0.0.1:18080/api/v1/health)"; then
              HEALTH_RESPONSE="$response" EXPECTED_VERSION="$(cat VERSION)" node -e '
                const health = JSON.parse(process.env.HEALTH_RESPONSE);
                if (health.status !== "ok" || health.version !== process.env.EXPECTED_VERSION) process.exit(1);
              '
              healthy=true
              break
            fi
            sleep 1
          done
          if [ "$healthy" != true ]; then
            docker logs "$container_id"
            exit 1
          fi
          ocr_response="$(curl --fail --silent \
            --form 'file=@backend/internal/document/testdata/scanned-league-rules.pdf;type=application/pdf' \
            http://127.0.0.1:18080/api/v1/leagues/rules/import)"
          OCR_RESPONSE="$ocr_response" node -e '
            const imported = JSON.parse(process.env.OCR_RESPONSE);
            if (imported.settings.name !== "OCR Test League" || imported.settings.teamCount !== 10) process.exit(1);
            if (imported.rules.passingTouchdown !== 6 || !imported.warnings.some((warning) => warning.includes("OCR"))) process.exit(1);
          '
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate container metadata
        if: github.event_name == 'push'
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish multi-architecture image
        if: github.event_name == 'push'
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployments/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Attest published container image
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub prerelease
    if: github.event_name == 'push'
    needs: [artifacts, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: draftmeld-native-${{ github.sha }}
          path: outputs/release
      - name: Create release notes
        run: node scripts/release-notes.mjs > outputs/release/release-notes.md
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          outputs/release/draftmeld_*
          --verify-tag
          --prerelease
          --title "DraftMeld $(cat VERSION)"
          --notes-file outputs/release/release-notes.md
