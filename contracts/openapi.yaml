openapi: 3.1.0
info:
  title: DraftMeld API
  version: 0.2.0
  description: Public contract between the DraftMeld frontend and backend.
  license:
    name: GNU Affero General Public License v3.0
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
security: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report service health and version
      responses:
        "200":
          description: DraftMeld is ready to accept requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /leagues:
    get:
      operationId: listLeagues
      summary: List configured fantasy leagues
      responses:
        "200":
          description: Configured leagues ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      operationId: createLeague
      summary: Create a fantasy league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeagueRules"
      responses:
        "201":
          description: League created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          $ref: "#/components/responses/BadRequest"
  /leagues/{leagueId}:
    parameters:
      - $ref: "#/components/parameters/LeagueIdPath"
    get:
      operationId: getLeague
      summary: Get one league configuration
      responses:
        "200":
          description: League configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateLeague
      summary: Replace a league configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeagueRules"
      responses:
        "200":
          description: Updated league configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteLeague
      summary: Delete a league and its draft history
      responses:
        "204":
          description: League deleted.
        "404":
          $ref: "#/components/responses/NotFound"
  /leagues/{leagueId}/duplicate:
    parameters:
      - $ref: "#/components/parameters/LeagueIdPath"
    post:
      operationId: duplicateLeague
      summary: Duplicate a league configuration without its draft history
      responses:
        "201":
          description: League duplicated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "404":
          $ref: "#/components/responses/NotFound"
  /ranking-sources:
    get:
      operationId: listRankingSources
      summary: List built-in ranking feeds and their refresh status
      responses:
        "200":
          description: Ranking source catalog.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RankingSource" }
        "500": { $ref: "#/components/responses/ServerError" }
  /ranking-sources/refresh:
    post:
      operationId: refreshRankingSources
      summary: Download and normalize every built-in ranking feed
      responses:
        "200":
          description: Refreshed ranking sources.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RankingSource" }
        "502":
          description: An upstream ranking feed could not be downloaded or parsed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /ranking-sources/import-pdf:
    post:
      operationId: importRankingPDF
      summary: Detect and import a supported user-supplied ranking PDF
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: The detected ranking source was normalized and imported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RankingPDFImport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413":
          description: The uploaded PDF exceeds the 20 MiB limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /rankings:
    get:
      operationId: getConsensusRankings
      summary: Build a league-weighted consensus from every imported feed
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: Normalized consensus rankings.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsensusRanking" }
        "500": { $ref: "#/components/responses/ServerError" }
  /ranking-watchlist:
    get:
      operationId: getRankingWatchlist
      summary: Find players favored by sources excluded from the league consensus
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: Up to five meaningful disabled-source ranking outliers.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items: { $ref: "#/components/schemas/WatchlistPlayer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /draft:
    get:
      operationId: getDraft
      summary: Get the current draft board and recommendations
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: Current draft state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /draft/actions:
    post:
      operationId: recordDraftAction
      summary: Draft a player to my team or mark the player taken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftActionRequest"
      responses:
        "200":
          description: Updated draft state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Player is no longer available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /draft/undo:
    post:
      operationId: undoDraftAction
      summary: Undo the most recent active draft action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leagueId]
              properties:
                leagueId:
                  type: string
      responses:
        "200":
          description: Updated draft state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: There is no active action to undo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  parameters:
    LeagueId:
      name: leagueId
      in: query
      required: true
      schema:
        type: string
    LeagueIdPath:
      name: leagueId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The request was not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: The request could not be completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          example: draftmeld
        version:
          type: string
          example: 0.2.0
    LeagueRules:
      type: object
      required: [name, teamCount, draftPosition, draftType, rosterSlots, scoringRules, sourcePreferences]
      properties:
        name:
          type: string
          minLength: 1
        teamCount:
          type: integer
          minimum: 2
          maximum: 32
        draftPosition:
          type: integer
          minimum: 1
          maximum: 32
        draftType:
          type: string
          enum: [snake, linear, auction]
        rosterSlots:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RosterSlot"
        scoringRules:
          type: object
          additionalProperties:
            type: number
        sourcePreferences:
          type: object
          description: Per-source inclusion and influence. Missing source IDs use enabled published defaults.
          additionalProperties:
            $ref: "#/components/schemas/RankingSourcePreference"
    League:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
        - $ref: "#/components/schemas/LeagueRules"
    RosterSlot:
      type: object
      additionalProperties: false
      required: [name, count, positions, isStarting]
      properties:
        name:
          type: string
        count:
          type: integer
          minimum: 1
        positions:
          type: array
          minItems: 1
          items:
            type: string
        isStarting:
          type: boolean
    RankingSource:
      type: object
      additionalProperties: false
      required: [id, name, description, methodology, license, projectUrl, dataUrl, defaultWeight, importMode, recordCount]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        methodology: { type: string }
        license: { type: string }
        projectUrl: { type: string, format: uri }
        dataUrl: { type: string, format: uri }
        defaultWeight: { type: number, exclusiveMinimum: 0 }
        importMode: { type: string, enum: [download, pdf-upload] }
        recordCount: { type: integer, minimum: 0 }
        refreshedAt: { type: [string, "null"], format: date-time }
        publishedAt: { type: string }
    RankingSourcePreference:
      type: object
      additionalProperties: false
      required: [weight, enabled]
      properties:
        weight: { type: number, exclusiveMinimum: 0, maximum: 10 }
        enabled: { type: boolean }
    RankingPDFImport:
      type: object
      additionalProperties: false
      required: [source, pageCount]
      properties:
        source: { $ref: "#/components/schemas/RankingSource" }
        pageCount: { type: integer, minimum: 1 }
    ConsensusRanking:
      type: object
      additionalProperties: false
      required: [playerKey, name, position, team, rank, score, sourceCount, sourceRanks]
      properties:
        playerKey: { type: string }
        name: { type: string }
        position: { type: string, enum: [QB, RB, WR, TE, K, DST] }
        team: { type: string }
        rank: { type: integer, minimum: 1 }
        score: { type: number }
        sourceCount: { type: integer, minimum: 1 }
        sourceRanks:
          type: object
          additionalProperties: { type: integer, minimum: 1 }
    WatchlistSignal:
      type: object
      additionalProperties: false
      required: [sourceId, sourceName, sourceRank, spotsHigher]
      properties:
        sourceId: { type: string }
        sourceName: { type: string }
        sourceRank: { type: integer, minimum: 1 }
        spotsHigher: { type: integer }
    WatchlistPlayer:
      type: object
      additionalProperties: false
      required: [playerKey, name, position, team, consensusRank, signals]
      properties:
        playerKey: { type: string }
        name: { type: string }
        position: { type: string, enum: [QB, RB, WR, TE, K, DST] }
        team: { type: string }
        consensusRank: { type: [integer, "null"], minimum: 1 }
        signals:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WatchlistSignal" }
    Player:
      type: object
      required: [id, name, nflTeam, position, byeWeek, overallRank, positionRank, adp, tier]
      properties:
        id: { type: string }
        name: { type: string }
        nflTeam: { type: string }
        position: { type: string, enum: [QB, RB, WR, TE, K, DST] }
        byeWeek: { type: integer }
        overallRank: { type: integer, minimum: 1 }
        positionRank: { type: integer, minimum: 1 }
        adp: { type: number }
        tier: { type: integer, minimum: 1 }
    Recommendation:
      type: object
      required: [player, score, reasons]
      properties:
        player: { $ref: "#/components/schemas/Player" }
        score: { type: number }
        reasons:
          type: array
          items: { type: string }
    Pick:
      type: object
      required: [eventId, number, action, player, createdAt]
      properties:
        eventId: { type: integer }
        number: { type: integer, minimum: 1 }
        action: { type: string, enum: [draft, taken] }
        player: { $ref: "#/components/schemas/Player" }
        createdAt: { type: string, format: date-time }
    DraftSnapshot:
      type: object
      required: [leagueId, leagueName, pickNumber, available, myTeam, history, recommendations, canUndo]
      properties:
        leagueId: { type: string }
        leagueName: { type: string }
        pickNumber: { type: integer, minimum: 1 }
        available:
          type: array
          items: { $ref: "#/components/schemas/Player" }
        myTeam:
          type: array
          items: { $ref: "#/components/schemas/Player" }
        history:
          type: array
          items: { $ref: "#/components/schemas/Pick" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
        canUndo: { type: boolean }
    DraftActionRequest:
      type: object
      required: [leagueId, playerId, action]
      properties:
        leagueId: { type: string }
        playerId: { type: string }
        action: { type: string, enum: [draft, taken] }
