openapi: 3.1.0
info:
  title: DraftMeld API
  version: 0.3.0
  description: Public contract between the DraftMeld frontend and backend.
  license:
    name: GNU Affero General Public License v3.0
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
security: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report service health and version
      responses:
        "200":
          description: DraftMeld is ready to accept requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /leagues:
    get:
      operationId: listLeagues
      summary: List configured fantasy leagues
      responses:
        "200":
          description: Configured leagues ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      operationId: createLeague
      summary: Create a fantasy league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeagueRules"
      responses:
        "201":
          description: League created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          $ref: "#/components/responses/BadRequest"
  /leagues/rules/import:
    post:
      operationId: importLeagueRules
      summary: Preview league settings and scoring rules recognized from a user-supplied PDF or CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Recognized rules for user review. The uploaded file is not retained.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueRuleImport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: The uploaded file exceeds the 20 MiB limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: The file was readable but contained no supported league settings or scoring rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /leagues/{leagueId}:
    parameters:
      - $ref: "#/components/parameters/LeagueIdPath"
    get:
      operationId: getLeague
      summary: Get one league configuration
      responses:
        "200":
          description: League configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateLeague
      summary: Replace a league configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeagueRules"
      responses:
        "200":
          description: Updated league configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteLeague
      summary: Delete a league and its draft history
      responses:
        "204":
          description: League deleted.
        "404":
          $ref: "#/components/responses/NotFound"
  /leagues/{leagueId}/duplicate:
    parameters:
      - $ref: "#/components/parameters/LeagueIdPath"
    post:
      operationId: duplicateLeague
      summary: Duplicate a league configuration without its draft history
      responses:
        "201":
          description: League duplicated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "404":
          $ref: "#/components/responses/NotFound"
  /leagues/{leagueId}/mock-drafts:
    parameters:
      - $ref: "#/components/parameters/LeagueIdPath"
    post:
      operationId: createMockDraft
      summary: Start a disposable mock draft using a league's current rules
      responses:
        "201":
          description: Mock draft created and started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockDraftSession"
        "404":
          $ref: "#/components/responses/NotFound"
  /leagues/import:
    post:
      operationId: importLeagueBackup
      summary: Restore a versioned league backup as a new league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeagueBackup"
      responses:
        "201":
          description: Backup restored as a new league without overwriting the original.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: The backup exceeds the 256 KiB limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /leagues/{leagueId}/backup:
    parameters:
      - $ref: "#/components/parameters/LeagueIdPath"
    get:
      operationId: exportLeagueBackup
      summary: Download a versioned league configuration backup
      responses:
        "200":
          description: Portable league backup.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueBackup"
        "404":
          $ref: "#/components/responses/NotFound"
  /leagues/{leagueId}/exports/rankings.csv:
    parameters:
      - $ref: "#/components/parameters/LeagueIdPath"
    get:
      operationId: exportConsensusRankingsCSV
      summary: Download league-weighted consensus rankings as CSV
      responses:
        "200":
          description: Consensus rankings with source evidence and weights.
          content:
            text/csv:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"
  /leagues/{leagueId}/exports/draft.csv:
    parameters:
      - $ref: "#/components/parameters/LeagueIdPath"
    get:
      operationId: exportDraftResultsCSV
      summary: Download current draft results as CSV
      responses:
        "200":
          description: Active draft picks in pick order.
          content:
            text/csv:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"
  /leagues/{leagueId}/exports/draft.json:
    parameters:
      - $ref: "#/components/parameters/LeagueIdPath"
    get:
      operationId: exportDraftResultsJSON
      summary: Download versioned draft results as JSON
      responses:
        "200":
          description: Versioned draft result export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftExport"
        "404":
          $ref: "#/components/responses/NotFound"
  /ranking-sources:
    get:
      operationId: listRankingSources
      summary: List built-in ranking feeds and their refresh status
      responses:
        "200":
          description: Ranking source catalog.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RankingSource" }
        "500": { $ref: "#/components/responses/ServerError" }
  /ranking-sources/refresh:
    post:
      operationId: refreshRankingSources
      summary: Download and normalize every built-in ranking feed
      responses:
        "200":
          description: Refreshed ranking sources.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RankingSource" }
        "502":
          description: An upstream ranking feed could not be downloaded or parsed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /ranking-sources/{sourceId}/refresh:
    post:
      operationId: refreshRankingSource
      summary: Download and normalize one built-in ranking feed
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Refreshed ranking source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RankingSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: The upstream ranking feed could not be downloaded or parsed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /ranking-sources/import-pdf:
    post:
      operationId: importRankingPDF
      summary: Detect and import a supported user-supplied ranking PDF
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: The detected ranking source was normalized and imported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RankingPDFImport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413":
          description: The uploaded PDF exceeds the 20 MiB limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /ranking-sources/import-csv:
    post:
      operationId: importRankingCSV
      summary: Import a private ordinal ranking source from CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                file: { type: string, format: binary }
                mapping:
                  type: string
                  description: JSON object mapping DraftMeld field names to source CSV headers.
      responses:
        "201":
          description: The private ranking source was normalized and imported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RankingSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /projection-sources:
    get:
      operationId: listProjectionSources
      summary: List user-imported granular projection sources
      responses:
        "200":
          description: Imported projection sources.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectionSource" }
  /projection-sources/import-csv:
    post:
      operationId: importProjectionCSV
      summary: Import granular player projections from CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name: { type: string }
                file: { type: string, format: binary }
                mapping:
                  type: string
                  description: JSON object mapping DraftMeld field names to source CSV headers.
      responses:
        "201":
          description: Imported projection source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectionSource" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /ranking-identities:
    get:
      operationId: listRankingIdentityIssues
      summary: List potentially ambiguous canonical player matches
      responses:
        "200":
          description: Reviewable identity issues.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IdentityIssue" }
  /player-directory/status:
    get:
      operationId: getPlayerDirectoryStatus
      summary: Summarize persisted canonical player identities
      responses:
        "200":
          description: Canonical player directory counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerDirectoryStatus" }
  /ranking-identities/review:
    post:
      operationId: reviewRankingIdentity
      summary: Record a human review of an identity issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issueKey, resolution]
              properties:
                issueKey: { type: string }
                resolution: { type: string, enum: [confirmed-separate, acknowledged, merged] }
                canonicalPlayerKey: { type: string }
      responses:
        "204": { description: Identity review saved. }
  /rankings:
    get:
      operationId: getConsensusRankings
      summary: Build a league-weighted consensus from every imported feed
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: Normalized consensus rankings.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsensusRanking" }
        "500": { $ref: "#/components/responses/ServerError" }
  /ranking-watchlist:
    get:
      operationId: getRankingWatchlist
      summary: Find players favored by sources excluded from the league consensus
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: Up to five meaningful disabled-source ranking outliers.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items: { $ref: "#/components/schemas/WatchlistPlayer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /draft:
    get:
      operationId: getDraft
      summary: Get the current draft board and recommendations
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: Current draft state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /draft/actions:
    post:
      operationId: recordDraftAction
      summary: Draft a player to my team or mark the player taken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftActionRequest"
      responses:
        "200":
          description: Updated draft state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Player is no longer available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /draft/session/start:
    post:
      operationId: startDraftSession
      summary: Start the current league season's draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftSessionRequest" }
      responses:
        "200":
          description: Started draft state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /draft/session/reset:
    post:
      operationId: resetDraftSession
      summary: Clear current-season selections while preserving league assets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftResetRequest" }
      responses:
        "200":
          description: Reset draft state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /draft/session/undo-reset:
    post:
      operationId: undoDraftSessionReset
      summary: Restore the selections removed by the most recent reset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftSessionRequest" }
      responses:
        "200":
          description: Restored draft state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/ServerError" }
  /draft/trades:
    post:
      operationId: createDraftTrade
      summary: Trade eligible draft assets between two teams
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftPickTradeRequest" }
      responses:
        "201":
          description: Draft state with the updated pick ownership schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /draft/trades/{tradeId}:
    delete:
      operationId: deleteDraftTrade
      summary: Reverse a trade whose assets remain eligible
      parameters:
        - name: tradeId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: Draft state with the trade reversed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /draft/trades/{tradeId}/condition:
    put:
      operationId: resolveDraftTradeCondition
      summary: Resolve a pending conditional future pick
      parameters:
        - name: tradeId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeConditionRequest" }
      responses:
        "200":
          description: Draft state with the condition resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /draft/seasons:
    post:
      operationId: advanceDraftSeason
      summary: Close the current dynasty season and start the next draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeasonRolloverRequest" }
      responses:
        "200":
          description: Fresh next-season draft state with persistent dynasty assets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /draft/undo:
    post:
      operationId: undoDraftAction
      summary: Undo the most recent active draft action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leagueId]
              properties:
                leagueId:
                  type: string
      responses:
        "200":
          description: Updated draft state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: There is no active action to undo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"
  /draft/preferences:
    put:
      operationId: setDraftPlayerPreference
      summary: Mark a player as a target, avoid, or neutral
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leagueId, playerId, preference]
              properties:
                leagueId: { type: string }
                playerId: { type: string }
                preference: { type: string, enum: [target, avoid, ""] }
      responses:
        "200":
          description: Updated draft state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftSnapshot" }
  /draft/mock:
    post:
      operationId: simulateDraftToNextTurn
      summary: Simulate opponent picks until the user's next turn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leagueId]
              properties:
                leagueId: { type: string }
      responses:
        "200":
          description: Draft state after simulated opponent picks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftSnapshot" }
  /draft/sync/sleeper:
    post:
      operationId: syncSleeperDraft
      summary: Import current picks from a public Sleeper draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leagueId, sleeperDraftId, rosterId]
              properties:
                leagueId: { type: string }
                sleeperDraftId: { type: string }
                rosterId: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Reconciliation summary and draft state after Sleeper synchronization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SleeperSyncResult" }
components:
  parameters:
    LeagueId:
      name: leagueId
      in: query
      required: true
      schema:
        type: string
    LeagueIdPath:
      name: leagueId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The request was not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with the current draft state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: The request could not be completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          example: draftmeld
        version:
          type: string
          example: 0.3.0
    LeagueRules:
      type: object
      required:
        [
          name,
          teamCount,
          draftPosition,
          userTeamNumber,
          teamNames,
          draftOrder,
          draftType,
          leagueFormat,
          season,
          initialSeason,
          futurePickSeasons,
          rookieDraftRounds,
          auctionBudgetTrades,
          faabBudget,
          faabTrades,
          rosterSlots,
          scoringRules,
          sourcePreferences,
          consensusMethod,
          playerPreferences,
          auctionBudget,
          auctionMinimumBid,
          keeperBudgetSpent,
          myKeeperSpend,
          keeperValueRemoved,
        ]
      properties:
        name:
          type: string
          minLength: 1
        teamCount:
          type: integer
          minimum: 2
          maximum: 32
        draftPosition:
          type: integer
          minimum: 0
          maximum: 32
          description: Zero means the league has not assigned the user's draft position yet.
        userTeamNumber:
          type: integer
          minimum: 1
          maximum: 32
        teamNames:
          type: array
          minItems: 2
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 80
        draftOrder:
          type: array
          minItems: 2
          maxItems: 32
          items: { type: integer, minimum: 1, maximum: 32 }
        draftType:
          type: string
          enum: [snake, linear, auction]
        leagueFormat:
          type: string
          enum: [redraft, dynasty]
        season: { type: integer, minimum: 2020, maximum: 2200 }
        initialSeason: { type: integer, minimum: 2020, maximum: 2200 }
        futurePickSeasons: { type: integer, minimum: 0, maximum: 5 }
        rookieDraftRounds: { type: integer, minimum: 1, maximum: 10 }
        auctionBudgetTrades: { type: boolean }
        faabBudget: { type: number, minimum: 0 }
        faabTrades: { type: boolean }
        rosterSlots:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RosterSlot"
        scoringRules:
          type: object
          description: Custom points per projected event. Missing or zero-valued categories are disabled.
          additionalProperties:
            type: number
        sourcePreferences:
          type: object
          description: Per-source inclusion and influence. Missing source IDs use enabled published defaults.
          additionalProperties:
            $ref: "#/components/schemas/RankingSourcePreference"
        consensusMethod:
          type: string
          enum: [weighted-average, weighted-median, trimmed-mean]
        playerPreferences:
          type: object
          additionalProperties:
            type: string
            enum: [target, avoid]
        auctionBudget:
          type: number
          exclusiveMinimum: 0
        auctionMinimumBid:
          type: number
          exclusiveMinimum: 0
        keeperBudgetSpent:
          type: number
          minimum: 0
        myKeeperSpend:
          type: number
          minimum: 0
        keeperValueRemoved:
          type: number
          minimum: 0
    League:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
