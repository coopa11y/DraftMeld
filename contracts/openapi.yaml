openapi: 3.1.0
info:
  title: DraftMeld API
  version: 0.2.0
  description: Public contract between the DraftMeld frontend and backend.
  license:
    name: GNU Affero General Public License v3.0
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
security: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report service health and version
      responses:
        "200":
          description: DraftMeld is ready to accept requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /draft:
    get:
      operationId: getDraft
      summary: Get the current draft board and recommendations
      parameters:
        - $ref: "#/components/parameters/LeagueId"
      responses:
        "200":
          description: Current draft state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /draft/actions:
    post:
      operationId: recordDraftAction
      summary: Draft a player to my team or mark the player taken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftActionRequest"
      responses:
        "200":
          description: Updated draft state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Player is no longer available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /draft/undo:
    post:
      operationId: undoDraftAction
      summary: Undo the most recent active draft action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leagueId]
              properties:
                leagueId:
                  type: string
      responses:
        "200":
          description: Updated draft state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: There is no active action to undo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  parameters:
    LeagueId:
      name: leagueId
      in: query
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The request was not valid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: The request could not be completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          example: draftmeld
        version:
          type: string
          example: 0.2.0
    LeagueRules:
      type: object
      additionalProperties: false
      required: [name, teamCount, draftType, rosterSlots, scoringRules]
      properties:
        name:
          type: string
          minLength: 1
        teamCount:
          type: integer
          minimum: 2
          maximum: 32
        draftType:
          type: string
          enum: [snake, linear, auction]
        rosterSlots:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RosterSlot"
        scoringRules:
          type: object
          additionalProperties:
            type: number
    RosterSlot:
      type: object
      additionalProperties: false
      required: [name, count, positions, isStarting]
      properties:
        name:
          type: string
        count:
          type: integer
          minimum: 1
        positions:
          type: array
          minItems: 1
          items:
            type: string
        isStarting:
          type: boolean
    Player:
      type: object
      required: [id, name, nflTeam, position, byeWeek, overallRank, positionRank, adp, tier]
      properties:
        id: { type: string }
        name: { type: string }
        nflTeam: { type: string }
        position: { type: string, enum: [QB, RB, WR, TE] }
        byeWeek: { type: integer }
        overallRank: { type: integer, minimum: 1 }
        positionRank: { type: integer, minimum: 1 }
        adp: { type: number }
        tier: { type: integer, minimum: 1 }
    Recommendation:
      type: object
      required: [player, score, reasons]
      properties:
        player: { $ref: "#/components/schemas/Player" }
        score: { type: number }
        reasons:
          type: array
          items: { type: string }
    Pick:
      type: object
      required: [eventId, number, action, player, createdAt]
      properties:
        eventId: { type: integer }
        number: { type: integer, minimum: 1 }
        action: { type: string, enum: [draft, taken] }
        player: { $ref: "#/components/schemas/Player" }
        createdAt: { type: string, format: date-time }
    DraftSnapshot:
      type: object
      required: [leagueId, leagueName, pickNumber, available, myTeam, history, recommendations, canUndo]
      properties:
        leagueId: { type: string }
        leagueName: { type: string }
        pickNumber: { type: integer, minimum: 1 }
        available:
          type: array
          items: { $ref: "#/components/schemas/Player" }
        myTeam:
          type: array
          items: { $ref: "#/components/schemas/Player" }
        history:
          type: array
          items: { $ref: "#/components/schemas/Pick" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
        canUndo: { type: boolean }
    DraftActionRequest:
      type: object
      required: [leagueId, playerId, action]
      properties:
        leagueId: { type: string }
        playerId: { type: string }
        action: { type: string, enum: [draft, taken] }
